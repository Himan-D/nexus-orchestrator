services:
  backend:
    build: .
    environment:
      # Generate a real secret for anything beyond local dev:
      #   openssl rand -hex 32
      ORCH_JWT_SECRET: ${ORCH_JWT_SECRET:?set ORCH_JWT_SECRET in .env}
      ORCH_DB_URL: sqlite:///data/orchestrator.db?mode=rwc
      ORCH_BIND: 0.0.0.0:3002
      ORCH_COOKIE_SECURE: "0"
    volumes:
      - orchestrator-data:/data
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v curl >/dev/null && curl -sf http://127.0.0.1:3002/readyz || wget -qO- http://127.0.0.1:3002/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:3002
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  orchestrator-data:
